<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="1200">
    <title>Звёздочка на ниточке</title>
    <style>
        html, body {
            margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        height: 100%;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
    const CHANNEL_ID = {{ channel_id }};
    const POSITION = {{ position }};
    const SIZE = {{ size }};
    const COLOR = "{{ color }}";
    const LENGTH = {{ length }};
    const BREAK_CHANCE = {{ break_chance }};  // in %, default 0.1%? 100 + 692 (0.999 ^ 692 = 0.5)
</script>
<script src="/static/js/heat-ws.js"></script>
{% if chat_control %}
<script>
    const CHANNEL_NAME = "{{ channel_name }}";
    const OVERLAY_SECRET = new URLSearchParams(window.location.search).get('secret') || '';
    const CHAT_FILTER = "!дуть|!дунуть|!подуть|!фуф|!шуш|!толкнуть|!толкать";
    const CUSTOM_COMMANDS = [
        {name: "подуть", aliases: "!дуть, !дунуть, !подуть, !фуф, !шуш", description: "Подуть на элементы оверлея"},
        {name: "толкнуть", aliases: "!толкнуть, !толкать", description: "Толкнуть звёздочку на оверлее"},
    ];
</script>
<script src="/static/js/chat-listener.js"></script>
{% endif %}
<script src="/static/js/star.js"></script>
</body>
</html>
