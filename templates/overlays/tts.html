<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OBS TTS Overlay</title>
    <style>
        body { background: transparent; margin: 0; padding: 0; overflow: hidden; }
        #unlock {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.85); color: #fff;
            font: 16px sans-serif; cursor: pointer; z-index: 999;
        }
        #unlock.hidden { display: none; }
    </style>
</head>
<body>
<div id="unlock">Click to enable TTS</div>
<script>
    // ── Настройки из сервера ───────────────────────────────────
    const CHANNEL_ID = {{ channel_id|tojson }};
    const SSE_URL = `{{ request.base_url }}sse/${CHANNEL_ID}/tts`;
    const API_URL = {{ tts_speech_url|tojson }};
    const MODEL = {{ model|tojson }};
    // ───────────────────────────────────────────────────────────

    // ── Очередь воспроизведения (по одному за раз) ──────────────
    const queue = [];
    const MAX_QUEUE = 10;
    let isPlaying = false;

    function enqueue(text, model) {
        if (queue.length >= MAX_QUEUE) {
            queue.shift();
        }
        queue.push({ text, model });
        processQueue();
    }

    async function processQueue() {
        if (isPlaying || queue.length === 0) return;
        isPlaying = true;

        const { text, model } = queue.shift();
        try {
            await fetchAndPlaySpeech(text, model);
        } catch (error) {
            console.error("TTS error:", error);
        } finally {
            isPlaying = false;
            processQueue();
        }
    }

    async function fetchAndPlaySpeech(text, model) {
        console.log(`[TTS] ${text}`);
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: model || MODEL,
                response_format: "mp3",
                input: text,
            }),
        });
        if (!response.ok) {
            throw new Error(`Server error: ${response.status}`);
        }

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);

        await new Promise((resolve) => {
            const audio = new Audio(audioUrl);
            audio.onended = () => { URL.revokeObjectURL(audioUrl); resolve(); };
            audio.onerror = () => { URL.revokeObjectURL(audioUrl); resolve(); };
            audio.play().catch((err) => {
                console.warn("play() blocked:", err);
                URL.revokeObjectURL(audioUrl);
                resolve();
            });
        });
    }
    // ───────────────────────────────────────────────────────────

    // ── SSE-клиент ──────────────────────────────────────────────
    let eventSource = null;

    function connectSSE() {
        if (eventSource) {
            eventSource.close();
        }
        eventSource = new EventSource(SSE_URL);

        eventSource.onopen = () => {
            console.log("[SSE] Connected to TTS channel");
        };

        eventSource.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.text) {
                    enqueue(data.text, data.model);
                }
            } catch (e) {
                console.error("SSE parse error:", e);
            }
        };

        eventSource.onerror = (e) => {
            console.warn("[SSE] error:", e);
        };
    }
    // ───────────────────────────────────────────────────────────

    // ── Разблокировка аудио (политика автозапуска) ─────────────
    const unlockEl = document.getElementById("unlock");

    function startWidget() {
        unlockEl.classList.add("hidden");
        connectSSE();
    }

    // ── Запуск ─────────────────────────────────────────────────
    const isOBS = window.obsstudio || navigator.userAgent.includes("OBS") || navigator.userAgent.includes("CefSharp");

    if (isOBS) {
        if (window.obsstudio && window.obsstudio.onActiveChange) {
            window.obsstudio.onActiveChange((active) => { if (active) startWidget(); });
        } else {
            startWidget();
        }
    } else {
        unlockEl.addEventListener("click", startWidget);
    }
</script>
</body>
</html>
