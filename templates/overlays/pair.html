<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Pair Memory Heat Game</title>
  <style>
    :root {
      --pair-front-1: {{ theme_colors.front1 }};
      --pair-front-2: {{ theme_colors.front2 }};
      --pair-back-1: {{ theme_colors.back1 }};
      --pair-back-2: {{ theme_colors.back2 }};
      --pair-caption: {{ theme_colors.caption }};
      --pair-glow: {{ theme_colors.glow }};
      --pair-shadow: {{ theme_colors.shadow }};
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .wrapper {
      position: absolute;
      top: var(--offset-top);
      left: var(--offset-left);
      right: var(--offset-right);
      bottom: var(--offset-bottom);
    }

    .game {
      display: grid;
      width: 100%;
      height: 100%;
    }

    #fx-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .card {
      width: var(--card-size);
      height: var(--card-size);

      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s ease, box-shadow .4s ease, opacity .5s ease;
      cursor: pointer;
      /* радиус повторяет форму граней — иначе тень торчит прямыми углами */
      border-radius: 12%;
      box-shadow: var(--pair-shadow);
    }

    .card.flipped { transform: rotateY(180deg); }
    .card.matched {
      pointer-events: none;
      box-shadow: 0 0 26px 4px var(--pair-glow);
    }
    .card.gone {
      pointer-events: none;
      opacity: 0;
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 12%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .front {
      background: linear-gradient(135deg, var(--pair-front-1), var(--pair-front-2));
    }

    .back {
      transform: rotateY(180deg);
      background: linear-gradient(135deg, var(--pair-back-1), var(--pair-back-2));
      flex-direction: column;
      padding: 8%;
    }

    .back img {
      /* квадратный элемент = круглая обрезка без эллипса;
         flex: 1 1 0 отдаёт нику его место, остаток — аватарке */
      flex: 1 1 0;
      min-height: 0;
      width: auto;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 50%;
    }

    .caption {
      font-size: clamp(10px, calc(var(--card-size) * 0.14), 24px);
      margin-top: calc(var(--card-size) * 0.03);
      color: var(--pair-caption);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    /* Компактный режим (ники выключены или карточки мелкие):
       подписи скрыты, картинка занимает всю карточку. */
    .game.compact .back { padding: 0; }
    .game.compact .back img {
      width: 100%;
      aspect-ratio: auto;
      border-radius: 0;
      object-fit: cover;
    }
    .game.compact .caption { display: none; }

    /* Спиральная карточка — лишняя клетка нечётной сетки. */
    .spiral-disc {
      width: 72%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: repeating-conic-gradient(#1a1a1a 0deg 14deg, #f2f2f2 14deg 28deg);
      animation: spiral-spin 2.4s linear infinite;
    }

    @keyframes spiral-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<canvas id="fx-canvas"></canvas>

<div class="wrapper">
  <div class="game" id="game"></div>
</div>

<script>
  const CHANNEL_ID = {{ channel_id }};
  const OFFSET_LEFT = {{ offset.left }};   // 0..1
  const OFFSET_TOP = {{ offset.top }};
  const OFFSET_RIGHT = {{ offset.right }};
  const OFFSET_BOTTOM = {{ offset.bottom }};
  const PAIRS = {{ cards | tojson | safe }};

  const CARD_SCALE = {{ card_scale | default(1) }};
  const GRID_COLS = {{ cols | default(5) }};
  const GRID_ROWS = {{ rows | default(4) }};
  const HAS_SPIRAL = {{ spiral | tojson }};
  const SHOW_NAMES = {{ show_names | tojson }};
  const RESTART_DELAY = {{ restart_delay | default(8) }};
  const USE_TWITCH_EMOJI = {{ use_twitch_emoji | tojson }};
  const ARBUZ = {{ arbuz | tojson }};
</script>

<script>
  const COMPACT_CARD_PX = 110;

  function updateLayout() {
    const cols = GRID_COLS;
    const rows = GRID_ROWS;

    // 👉 перевод процентов в пиксели
    const offsetLeftPx = window.innerWidth * OFFSET_LEFT;
    const offsetRightPx = window.innerWidth * OFFSET_RIGHT;
    const offsetTopPx = window.innerHeight * OFFSET_TOP;
    const offsetBottomPx = window.innerHeight * OFFSET_BOTTOM;

    // защита от некорректных значений
    const width = Math.max(0, window.innerWidth - offsetLeftPx - offsetRightPx);
    const height = Math.max(0, window.innerHeight - offsetTopPx - offsetBottomPx);

    // максимальный квадрат
    const baseSize = Math.min(
      width / cols,
      height / rows
    );

    const cardSize = baseSize * CARD_SCALE;

    // gap отдельно по осям
    const gapX = cols > 1
      ? (width - cardSize * cols) / (cols - 1)
      : 0;

    const gapY = rows > 1
      ? (height - cardSize * rows) / (rows - 1)
      : 0;

    const game = document.getElementById('game');

    game.style.gridTemplateColumns = `repeat(${cols}, ${cardSize}px)`;
    game.style.gridTemplateRows = `repeat(${rows}, ${cardSize}px)`;

    game.style.columnGap = `${Math.max(0, gapX)}px`;
    game.style.rowGap = `${Math.max(0, gapY)}px`;

    // прокидываем в CSS
    document.documentElement.style.setProperty('--card-size', cardSize + 'px');

    // мелкие карточки: прячем ники, картинка занимает всю карточку
    game.classList.toggle('compact', !SHOW_NAMES || cardSize < COMPACT_CARD_PX);

    // подгоняем кегль ников под ширину карточки (многоточие — только крайний случай)
    if (typeof window.__fitPairCaptions === 'function') window.__fitPairCaptions();

    document.documentElement.style.setProperty('--offset-left', offsetLeftPx + 'px');
    document.documentElement.style.setProperty('--offset-top', offsetTopPx + 'px');
    document.documentElement.style.setProperty('--offset-right', offsetRightPx + 'px');
    document.documentElement.style.setProperty('--offset-bottom', offsetBottomPx + 'px');
  }

  window.addEventListener('resize', updateLayout);
  window.addEventListener('load', updateLayout);
</script>

<script src="/static/js/heat-ws.js"></script>
<script src="/static/js/pair.js"></script>

</body>
</html>
