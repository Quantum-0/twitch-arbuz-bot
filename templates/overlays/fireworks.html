<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="1200">
    <title>Салют по клику</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            height: 100%;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<canvas id="fireworksCanvas"></canvas>
<script>
    const CHANNEL_ID = {{ channel_id }};
    const PARTICLE_COUNT = {{ particle_count }};
    const DECAY = {{ decay }};
    const GRAVITY = {{ gravity }};
</script>
<script src="/static/js/heat-ws.js"></script>
{% if chat_control %}
<script>
    const CHANNEL_NAME = "{{ channel_name }}";
    const OVERLAY_SECRET = new URLSearchParams(window.location.search).get('secret') || '';
    const CHAT_FILTER = "!салют";
    const CUSTOM_COMMANDS = [
        {name: "салют", aliases: "!салют", description: "Запустить салют на оверлее"},
    ];
</script>
<script src="/static/js/chat-listener.js"></script>
{% endif %}
<script src="/static/js/fireworks.js"></script>
</body>
</html>
