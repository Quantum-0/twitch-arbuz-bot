<h3>Другие настройки</h3>
<small class="overlay-copy-hint">
    <p>Прочие настройки, не попавшие в другие категории.</p>
</small>
<div class="toggles-grid active">
    <div class="toggle-label">
        <span>Включить shoutout на рейды</span>
        <div class="toggle-switch {% if settings.enable_shoutout_on_raid %}active{% endif %}" data-name="enable_shoutout_on_raid"></div>
    </div>
</div>

<div style="margin-top: 20px;">
    <h4>Ключ оверлеев</h4>
    <p><small>Секретный ключ для авторизации оверлеев (управление из чата, словотрон). Если ключ скомпрометирован, вы можете сбросить его. После сброса обновите ссылки на оверлеи в OBS.</small></p>
    <button class="install-btn" onclick="resetOverlaySecret()">Сбросить ключ оверлеев</button>
</div>
