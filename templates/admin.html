{% extends "base.html" %}

{% block title %}Админ-панель{% endblock %}

{% block content %}
<h2>Бета-тестирование</h2>

<div class="admin-row">
    <input type="text" id="twitchLoginInput" placeholder="Введите Twitch логин" maxlength="64" autocomplete="off">
    <button id="betaTestBtn">Добавить</button>
</div>

<div id="statusMessage" class="admin-status"></div>

<h2 style="margin-top: 40px">Пополнение баланса</h2>

<div class="admin-row">
    <div class="admin-input-wrap">
        <input type="text" id="depositLoginInput" placeholder="Логин стримера (начните вводить — подскажем)" maxlength="64" autocomplete="off">
    </div>
    <input type="number" id="depositAmount" min="1" max="500" step="0.01" placeholder="Сумма, 1–500">
    <button id="depositBtn">Пополнить</button>
</div>

<div id="depositStatus" class="admin-status"></div>

{% endblock %}

{% block body_scripts %}
<script src="/static/js/user-suggest.js"></script>
<script src="/static/js/admin.js"></script>
{% endblock %}
